[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-scout-backend"
version = "0.1.0"
description = "Research Scout Agent backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "aiosqlite>=0.20",
  "alembic>=1.14",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "email-validator>=2.2",
  "PyJWT>=2.10",
  "pwdlib[argon2]>=0.2",
  "httpx>=0.28",
  "feedparser>=6.0",
  "tenacity>=9.0",
  "celery[redis]>=5.5",
  "redis>=5.2",
  "langgraph>=0.2.60",
  "langchain-core>=0.3",
  "langchain-openai>=0.3",
  "python-dateutil>=2.9",
  "jieba>=0.42.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.22",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Chinese prompt text is kept verbatim and naturally exceeds the line limit.
"app/agents/prompts.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
