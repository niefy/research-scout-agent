name: research-scout

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://research:research@postgres:5432/research_scout
  REDIS_URL: redis://redis:6379/0
  ENVIRONMENT: production
  DEBUG: "false"
  SQL_ECHO: "false"
  AUTO_CREATE_TABLES: "false"
  SEED_ON_STARTUP: "true"
  SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
  CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080

x-backend-build: &backend-build
  build:
    context: ./backend
  env_file:
    - .env
  environment:
    <<: *backend-env
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research
      POSTGRES_DB: research_scout
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research_scout"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    <<: *backend-build
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *backend-build
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    <<: *backend-build
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=info
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
